<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lift Library</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Lift Library</h1>
        <small>log in implemented soon!</small>
    </header>
    <main class="builder">
        <div class="content">
            <section class="card">
                <h2>Barbell Builder</h2>
                <div class="view" id="view"></div>
                <div class="total" id="total"></div>
                <div class="msg" id="msg" role="status"></div>
                <div class="row">
                    <div class="toggle">
                        <button type="button" id="uLb" class="chip active">lb</button>
                        <button type="button" id="uKg" class="chip">kg</button>
                    </div>
                    <button type="button" id="undo">Remove outer plates</button>
                    <button type="button" id="clear">Clear all</button>
                </div>
                <div class="row">
                    <label>Lift name
                        <input id="name" list="lifts" placeholder="e.g. Back squat" maxlength="40">
                    </label>
                    <datalist id="lifts">
                        <option value="Back squat">
                        <option value="Front squat">
                        <option value="Bench press">
                        <option value="Deadlift">
                        <option value="Overhead press">
                        <option value="Power clean">
                    </datalist>
                    <label>Date
                        <input id="date" type="date">
                    </label>
                    <button type="button" id="log" class="primary">Log lift</button>
                    <button type="button" id="cancel" hidden>Cancel edit</button>
                </div>
            </section>
            <div class="panels">
                <section class="card">
                    <h2 id="pt">Plates</h2>
                    <div class="opts" id="plates"></div>
                </section>
                <section class="card">
                    <h2>Bars</h2>
                    <div class="opts vertical" id="bars"></div>
                </section>
                <section class="card">
                    <h2>Cuffs</h2>
                    <div class="opts vertical" id="cuffs"></div>
                </section>
            </div>
        </div>
        <aside class="card side">
            <h2>Library</h2>
            <div id="lib"></div>
        </aside>
    </main>
</body>
</html>
